[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-seo-workbench"
version = "0.1.0"
description = "Local-first, multi-site SEO data workbench with pluggable imports and MCP tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.30,<1",
  "mcp>=2.2,<3",
  "openpyxl>=3.1,<4",
  "tzdata>=2025.2",
]

[project.scripts]
seo-workbench = "seo_platform.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["seo_platform*"]
